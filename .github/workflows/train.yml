name: Train win probability model
run-name: Train ${{ inputs.model }} ${{ inputs.model_version }} on up to ${{ inputs.matches }} matches from ${{ inputs.days }} day(s)

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to train
        type: choice
        options: [graph, kumo]
        default: graph
      model_version:
        description: Model version (for example v1.0.0)
        type: string
        required: true
      features:
        description: Feature set (Kumo only)
        type: choice
        options: [heroes-items, heroes, baseline]
        default: heroes-items
      data_version:
        description: Matching boon-data client version (required for Kumo heroes-items)
        type: string
      context_rows:
        description: Maximum context rows (Kumo only)
        type: number
        default: 2048
      num_estimators:
        description: Number of ensemble estimators (Kumo only)
        type: number
        default: 8
      days:
        description: Parquet build-age window in days
        type: number
        default: 1
      matches:
        description: Maximum usable matches to sample (minimum 3)
        type: number
        default: 20
      workers:
        description: Number of disjoint preparation workers (1-256)
        type: number
        default: 4
      max_parallel:
        description: Maximum preparation jobs running concurrently
        type: number
        default: 4
      epochs:
        description: Training epochs
        type: number
        default: 3
      every:
        description: Ticks between snapshots
        type: number
        default: 4096
      max_snapshots:
        description: Maximum snapshots retained per match
        type: number
        default: 16
      batch_size:
        description: Graphs per tensor batch for training and evaluation
        type: number
        default: 2
      seed:
        description: Random seed
        type: number
        default: 42
      match_mode:
        description: Match mode
        type: choice
        options: [Ranked, Unranked, PrivateLobby, CoopBot, ServerTest, Tutorial, HeroLabs, NewPlayerPlacement]
        default: Ranked
      game_mode:
        description: Game mode
        type: choice
        options: [Normal, OneVsOneTest, Sandbox, StreetBrawl, ExploreNYC, Internal]
        default: Normal

concurrency:
  group: train-${{ inputs.model }}-${{ inputs.model_version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BOON_TICK_SEGMENTS: "1"
  POLARS_MAX_THREADS: "2"
  RAYON_NUM_THREADS: "2"
  OMP_NUM_THREADS: "2"
  MPLBACKEND: Agg
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan_id: ${{ steps.plan.outputs.plan_id }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Validate model and version
        env:
          MODEL: ${{ inputs.model }}
          FEATURES: ${{ inputs.features }}
          CONTEXT_ROWS: ${{ inputs.context_rows }}
          NUM_ESTIMATORS: ${{ inputs.num_estimators }}
          DATA_VERSION: ${{ inputs.data_version }}
          MATCHES: ${{ inputs.matches }}
          MODEL_VERSION: ${{ inputs.model_version }}
        run: |
          if [[ ! "$MODEL_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a version such as v1.0.0" >&2
            exit 1
          fi
          if [ "$MODEL" = kumo ] && [ "$MATCHES" -lt 4 ]; then
            echo "Kumo needs at least four matches." >&2
            exit 1
          fi
          if [ "$MODEL" = kumo ]; then
            if [[ ! "$CONTEXT_ROWS" =~ ^[0-9]+$ ]] || [ "$CONTEXT_ROWS" -lt 2 ] ||
               [[ ! "$NUM_ESTIMATORS" =~ ^[0-9]+$ ]] || [ "$NUM_ESTIMATORS" -lt 1 ]; then
              echo "Kumo requires at least 2 context rows and 1 estimator." >&2
              exit 1
            fi
          fi
          if [ "$MODEL" = kumo ] && [ "$FEATURES" = heroes-items ] && [[ ! "$DATA_VERSION" =~ ^[0-9]+$ ]]; then
            echo "heroes-items needs a boon-data client version." >&2
            exit 1
          fi
      - name: Install locked dependencies
        run: uv sync --locked --no-dev
      - name: Discover and assign distinct replay candidates
        id: plan
        env:
          DAYS: ${{ inputs.days }}
          MATCHES: ${{ inputs.matches }}
          WORKERS: ${{ inputs.workers }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          EVERY: ${{ inputs.every }}
          MAX_SNAPSHOTS: ${{ inputs.max_snapshots }}
          SEED: ${{ inputs.seed }}
          MATCH_MODE: ${{ inputs.match_mode }}
          GAME_MODE: ${{ inputs.game_mode }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-dev dwp-prepare plan \
            --days "$DAYS" --matches "$MATCHES" --workers "$WORKERS" \
            --max-parallel "$MAX_PARALLEL" --every "$EVERY" \
            --max-snapshots "$MAX_SNAPSHOTS" --seed "$SEED" \
            --match-modes "$MATCH_MODE" --game-modes "$GAME_MODE" \
            --output plan.json | tee planning-result.json
          uv run --locked --no-dev python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          result = json.loads(Path("planning-result.json").read_text())
          print("matrix=" + json.dumps(result["matrix"]))
          print("plan_id=" + result["plan_id"])
          print("max_parallel=" + str(result["max_parallel"]))
          PY
      - name: Upload immutable preparation assignment
        uses: actions/upload-artifact@v7
        with:
          name: preparation-plan-${{ steps.plan.outputs.plan_id }}
          path: |
            plan.json
            planning-result.json
          overwrite: true
          if-no-files-found: error
          retention-days: 14

  prepare:
    name: Prepare graph shard ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --no-dev
      - name: Download shared candidate plan
        uses: actions/download-artifact@v8
        with:
          name: preparation-plan-${{ needs.plan.outputs.plan_id }}
          path: plan
      - name: Download, parse, and save assigned graph tables
        env:
          SHARD_ID: ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked --no-dev dwp-prepare shard \
            --plan plan/plan.json --shard-id "$SHARD_ID" \
            --output "parsed/shard-$SHARD_ID" 2>&1 | tee preparation.log
      - name: Upload parsed Parquet graphs
        uses: actions/upload-artifact@v7
        with:
          name: parsed-graphs-${{ needs.plan.outputs.plan_id }}-${{ matrix.shard }}
          path: parsed/shard-${{ matrix.shard }}/
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload preparation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preparation-log-${{ needs.plan.outputs.plan_id }}-${{ matrix.shard }}
          path: preparation.log
          overwrite: true
          if-no-files-found: warn
          retention-days: 14

  train:
    needs: [plan, prepare]
    outputs:
      artifact_id: ${{ steps.model_artifact.outputs.artifact-id }}
      model_version: ${{ steps.bundle.outputs.model_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Install locked dependencies
        env:
          MODEL: ${{ inputs.model }}
        run: |
          if [ "$MODEL" = kumo ]; then
            uv sync --locked --no-dev --extra tabular
          else
            uv sync --locked --no-dev --extra export
          fi
      - name: Download expected plan
        uses: actions/download-artifact@v8
        with:
          name: preparation-plan-${{ needs.plan.outputs.plan_id }}
          path: plan
      - name: Download all completed graph shards
        uses: actions/download-artifact@v8
        with:
          pattern: parsed-graphs-${{ needs.plan.outputs.plan_id }}-*
          path: prepared
          merge-multiple: false
      - name: Train and evaluate the selected model
        env:
          MODEL: ${{ inputs.model }}
          FEATURES: ${{ inputs.features }}
          CONTEXT_ROWS: ${{ inputs.context_rows }}
          NUM_ESTIMATORS: ${{ inputs.num_estimators }}
          DATA_VERSION: ${{ inputs.data_version }}
          MODEL_VERSION: ${{ inputs.model_version }}
          EPOCHS: ${{ inputs.epochs }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          SEED: ${{ inputs.seed }}
        shell: bash
        run: |
          set -euo pipefail
          # Print diagnostics while the process is alive: a runner shutdown can
          # prevent even always() artifact-upload steps from running.
          (
            while true; do
              {
                date -u '+%Y-%m-%dT%H:%M:%SZ training resources'
                free -m
                ps -eo pid,comm,pcpu,rss --sort=-rss | sed -n '1,8p'
                df -h . "${TMPDIR:-/tmp}"
              } | tee -a resources.log
              sleep 60
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          extra=()
          args=()
          output=runs/ci
          if [ "$MODEL" = kumo ]; then
            extra=(--extra tabular)
            args=(--features "$FEATURES" --context-rows "$CONTEXT_ROWS" --num-estimators "$NUM_ESTIMATORS")
            if [ "$FEATURES" = heroes-items ]; then
              args+=(--data-version "$DATA_VERSION")
            fi
            output=runs/ci/model
          fi
          /usr/bin/time -v -o training-resources.log \
            uv run --locked --no-dev "${extra[@]}" dwp-train \
            --prepared-data prepared --plan plan/plan.json \
            --model "$MODEL" --model-version "$MODEL_VERSION" "${args[@]}" \
            --epochs "$EPOCHS" --batch-size "$BATCH_SIZE" --seed "$SEED" \
            --device cpu --threads 2 --output "$output" 2>&1 | tee training.log
      - name: Prepare the versioned release bundle
        id: bundle
        env:
          MODEL: ${{ inputs.model }}
          MODEL_VERSION: ${{ inputs.model_version }}
        run: |
          if [ "$MODEL" = graph ]; then
            tag="model/graph-win/$MODEL_VERSION"
            uv run --locked --no-dev --extra export dwp-export runs/ci/model.pt \
              --output runs/ci/model --model-version "$tag"
          else
            tag="model/kumo-win/$MODEL_VERSION"
          fi
          echo "model_version=$tag" >> "$GITHUB_OUTPUT"
          cat runs/ci/model/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload model, metrics, and logs
        id: model_artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: win-probability-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runs/ci/
            training.log
            resources.log
            training-resources.log
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish validated model release
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download model artifact from the completed training job
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.train.outputs.artifact_id }}
          path: artifact
      - name: Publish versioned model
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.train.outputs.model_version }}
          MODEL: ${{ inputs.model }}
          REVISION: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          bundle=artifact/runs/ci/model
          if [ "$MODEL" = graph ]; then
            (cd "$bundle" && sha256sum --check SHA256SUMS)
            latest=--latest
          else
            hash=$(jq -er '.sha256["context.parquet"]' "$bundle/manifest.json")
            (cd "$bundle" && printf '%s  context.parquet\n' "$hash" | sha256sum --check)
            latest=--latest=false
          fi
          cat "$bundle/summary.md" > release-notes.md
          printf '\nTraining run: %s\n' "$RUN_URL" >> release-notes.md
          if gh release view "$TAG" --json isDraft --jq .isDraft > release-state.txt; then
            if [ "$(cat release-state.txt)" = false ]; then
              gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
              echo "Model release $TAG already exists. Choose a new version." >&2
              exit 1
            fi
            # A previous upload may have stopped partway through a draft release.
            gh release upload "$TAG" "$bundle"/* --clobber
          else
            gh release create "$TAG" --draft --target "$REVISION" \
              --title "Win probability $TAG" --notes-file release-notes.md "$bundle"/*
          fi
          gh release edit "$TAG" --draft=false "$latest"
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

  website:
    name: Deploy scenario editor with this model
    if: inputs.model == 'graph'
    needs: [train, release]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      model_version: ${{ needs.train.outputs.model_version }}
