[project]
name = "deadlock-win-prob"
version = "0.1.0"
description = "Win probability in Deadlock"
readme = "README.md"
authors = [
    { name = "Peter Xenopoulos", email = "pnxenopoulos@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boon-deadlock>=0.19.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "polars>=2.0.0",
    "requests>=2.34.2",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff==0.17.1",
    "ty==0.0.90",
]

[project.scripts]
deadlock-win-prob = "dwp.train:main"
dwp-train = "dwp.train:main"
dwp-prepare = "dwp.prepare:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dwp"]
